<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EFECE5">
  <meta name="description" content="Wedding Booking System for The Ballroom & The Bayu">
  <title>The Ballroom &amp; The Bayu — Wedding Booking System</title>

  <!-- Fonts & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDM-W1hux31vLHpGsopYV5WRT-9FDb7kyk",
      authDomain: "ballroombayusystem.firebaseapp.com",
      projectId: "ballroombayusystem",
      storageBucket: "ballroombayusystem.firebasestorage.app",
      messagingSenderId: "900964132462",
      appId: "1:900964132462:web:7c43a39dfa6afa682c9e57"
    };
    firebase.initializeApp(firebaseConfig);
    window.db = firebase.firestore();
  </script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1 class="brand-name">The Ballroom &amp; The Bayu</h1>
        <div class="brand-tag">Wedding booking system</div>
      </div>
      <div class="topbar-right" id="topbarRight"></div>
    </div>
  </header>

  <!-- Banner for Firebase / Rule Errors -->
  <div id="bannerZone"></div>

  <!-- Tab Navigation -->
  <nav class="tabbar-wrap" aria-label="Main Navigation">
    <div class="tabbar" id="tabbar"></div>
  </nav>

  <!-- Main Dynamic View Container -->
  <main id="mainView" class="main-view"></main>

  <!-- Generic Dynamic Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Sign In Modal Overlay -->
  <div class="modal-overlay" id="signInOverlay" aria-hidden="true">
    <div class="modal signin-card" role="dialog" aria-modal="true" aria-labelledby="signInTitle">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="signInTitle">Selamat datang</div>
          <div class="modal-sub">Sign in with your name &amp; password to continue</div>
        </div>
      </div>
      <div class="modal-body">
        <p class="helper-text">
          New staff accounts will automatically register their password on first login. Staff can only edit bookings they create — admins can edit everything.
        </p>
        <form id="signInForm">
          <div class="field">
            <label class="field-label" for="signInName">Nama anda / Username <span class="req">*</span></label>
            <input type="text" id="signInName" required autocomplete="username" placeholder="Masukkan nama pengguna">
          </div>
          <div class="field" style="margin-top: 10px;">
            <label class="field-label" for="signInPassword">Kata laluan / Password <span class="req">*</span></label>
            <div class="password-wrap">
              <input type="password" id="signInPassword" required autocomplete="current-password" placeholder="Masukkan kata laluan">
              <button type="button" class="toggle-pw-btn" data-toggle-pw="signInPassword" aria-label="Show password">
                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-gold btn-block" style="margin-top:16px;">Teruskan</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toasts" aria-live="polite" aria-atomic="true"></div>

  <!-- Application Logic -->
  <script src="script.js"></script>
</body>
</html>
